global_params:
  N: 100000 # size of the network
  T: 1 # number of time steps
  s: 0 # number of pre-intervention time steps
  gamma_matrix_generator: "complete" # method for generating the network. Options: "erdos_renyi", "complete", "empty"
  x_0_generator: "bernoulli" # method for generating the initial state. Options: "bernoulli", "fixed"
  gamma_matrix_params:
    p: 0.01 # probability of edge creation for "erdos-renyi"
  x_0_params:
    p: 0.2 # probability of being in state 1 for "bernoulli"
    fixed_val: 1   # options 1 or -1 for "fixed"

estimation_params:
  alpha: 1 # external field param
  beta: -1 # z^{(t)} -> x^{(t)}
  xi: 1 # x^{(t)} -> x^{(t)}
  eta: 0.5 # x^{(t-1)} -> x^{(t)}
  zeta: -0.3 # x^{(t-1)} -> z^{(t)}
  psi: 0.5 # z^{(t-1)} -> z^{(t)}

generation_params:
  seed: 42 # random seed for reproducibility
  process: "conditional" # options: "conditional", "Ising"
  gibbs_sweeps: 50 # number of Gibbs sweeps for sampling x^{(t)} in conditional model or sampling from the Ising process
