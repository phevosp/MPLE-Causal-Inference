base:
  cv_root_name: cv_runs
  cv_manifest_path: experiments/SyntheticHybridExperiments/cv_manifest.csv
  optimizer:
    steps: 2000
    tol: 1.0e-7
    seed: 0
    n_starts: 1
    proximal_lr: 1.0
  latent_rank: 5
  optimizer_mode: alternating_latent_rank
  lambda_nuclear: 0.0
  lambda_frobenius: 0.0
  lambda_uv_ridge: 0.0
  v_column_l2_max: 1.0
  estimation:
    fixed_scalar_params: {}
    beta_mask_pre_s: true
    beta_mask_post_e: true

searches:
  - name: alternating_uv_grid
    optimizer_mode: alternating_latent_rank
    grid:
      lambda_uv_ridge: [0.0005, 0.001, 0.005, 0.01, 0.05, 0.1, 0.5, 1.0]
