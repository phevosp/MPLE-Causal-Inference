        panel_path: experiments/USCountyVaccination_US/realized_interventions/intervention_complete_cov_ge_20__lag_2w__scope_trimmed/panel_data.npz
        z0_path: experiments/USCountyVaccination_US/realized_interventions/intervention_complete_cov_ge_20__lag_2w__scope_trimmed/z_0.npy
        artifact_dir: experiments/USCountyVaccination_US/realized_interventions/intervention_complete_cov_ge_20__lag_2w__scope_trimmed
