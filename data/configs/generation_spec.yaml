base:
  experiment_root: experiments/SyntheticHybridExperiments
  manifest_path: experiments/SyntheticHybridExperiments/generation_manifest.csv
  dimensions:
    N: 1000
    T: 100
    s: 0
  generation:
    gibbs_sweeps: 20
    seed: 42
  x0:
    generator: bernoulli
    params:
      p: 0.5
      fixed_val: null
  graph:
    source: generated
    generator: erdos_renyi
    params:
      p: 0.05
    artifact:
      gamma_path: null
      node_index_path: null
      artifact_dir: null
      network_name: null
      trim_scope: null
  intervention:
    source: generated
    artifact:
      panel_path: null
      z0_path: null
      artifact_dir: null
      shared_panel_dir: null
      outcome_code: null
      intervention_code: null
      lag_code: null
      trim_scope: null
  truth:
    B: 2.0
    latent_rank: 0
    scalars:
      beta: 0
      xi: 0
      eta: 0
      zeta: 0
      psi: 0

experiments:
  - name: synthetic_rank_1_B1
    generation:
      seed: 720
    truth:
      latent_rank: 1
      B: 1

  - name: synthetic_rank_10_B1
    generation:
      seed: 720
    truth:
      latent_rank: 10
      B: 1