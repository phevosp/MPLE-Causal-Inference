base:
  experiment_root: experiments/SyntheticHybridExperiments
  manifest_path: experiments/SyntheticHybridExperiments/generation_manifest.csv
  dimensions:
    N: 500
    T: 50
    s: 10
  generation:
    gibbs_sweeps: 5
    seed: 42
  x0:
    generator: bernoulli
    params:
      p: 0.5
      fixed_val: null
  graph:
    source: generated
    generator: erdos_renyi
    params:
      p: 0.05
    artifact:
      gamma_path: null
      node_index_path: null
      artifact_dir: null
      network_name: null
      trim_scope: null
  intervention:
    source: generated
    artifact:
      panel_path: null
      z0_path: null
      artifact_dir: null
      shared_panel_dir: null
      outcome_code: null
      intervention_code: null
      lag_code: null
      trim_scope: null
  truth:
    B: 1.0
    latent_rank: 0
    scalars:
      beta: 0.35
      xi: 0.75
      eta: 0.48
      zeta: -0.55
      psi: 0.8

experiments:
  - name: synthetic_rank_0
    generation:
      seed: 42

  - name: synthetic_rank_6_B1
    generation:
      seed: 720
    truth:
      B: 1.0
      latent_rank: 6

  - name: synthetic_rank_40_B1
