base:
  experiment_root: experiments/SyntheticHybridExperiments
  manifest_path: experiments/SyntheticHybridExperiments/generation_manifest.csv
  dimensions:
    N: 1000
    T: 100
  generation:
    gibbs_sweeps: 20
    seed: 42
  x0:
    generator: bernoulli
    params:
      p: 0.5
      fixed_val: null
  graph:
    source: generated
    generator: erdos_renyi
    params:
      p: 0.05
    artifact:
      gamma_path: null
      node_index_path: null
      artifact_dir: null
      network_name: null
      trim_scope: null
  intervention:
    source: generated
    generator: low_rank_probability
    params:
      singular_values: [1.0, 0.7, 0.49]
      probability_amplitude: 0.35
    artifact:
      panel_path: null
      z0_path: null
      artifact_dir: null
      shared_panel_dir: null
      outcome_code: null
      intervention_code: null
      lag_code: null
      trim_scope: null
  truth:
    B: 2.0
    field_mode: random_low_rank
    field_params:
      singular_values: [1.0, 0.7, 0.49]
    scalars:
      beta: -0.3
      xi: 0.8
      eta: 0.3
      zeta: 0
      psi: 0

experiments:
  - name: spectral_low_rank_base

  - name: spectral_low_rank_rank_5
    intervention:
      params:
        singular_values: [1.0, 0.7, 0.49, 0.343, 0.2401]
        probability_amplitude: 0.3
    truth:
      field_params:
        singular_values: [1.0, 0.7, 0.49, 0.343, 0.2401]

  - name: spectral_low_rank_confounding
    truth:
      field_mode: confounded_low_rank
      field_params:
        singular_values: [1.0, 0.5, 0.25]
