global_params:
  N: 1000 # size of the network
  T: 100 # number of time steps
  s: 20 # number of pre-intervention time steps
  B: 1 # upper bound on the temperature, i.e. on all coefficients and realized field values
  gamma_matrix_generator: "erdos_renyi" # method for generating the network. Options: "erdos_renyi", "complete", "cycle", "empty"
  x_0_generator: "bernoulli" # method for generating the initial state. Options: "bernoulli", "fixed"
  basis_params:
    field_mode: "uniform" # options: "uniform", "shared_feature_field", "latent_feature_matrix"
    num_shared_features: 5 # number of synthetic shared node features used when field_mode == "shared_feature_field"
    shared_feature_seed: 42 # random seed used to realize the shared node features
    latent_rank: 5 # rank of the latent feature matrix used when field_mode == "latent_feature_matrix"
  gamma_matrix_params:
    p: 0.01 # probability of edge creation for "erdos-renyi"
  x_0_params:
    p: 0.5 # probability of being in state 1 for "bernoulli"
    fixed_val: 1 # options 1 or -1 for "fixed"

estimation_params:
  fit_intervention_model: true # if false, MPLE conditions on observed z and does not estimate the z-process parameters zeta and psi
  field_coefs: [] # coefficients for the external field basis; the default uniform mode now uses no field templates
  tau_params:
    mode: "uniform_random" # options: "fixed", "uniform_random"
    lower: -0.2 # used when mode == "uniform_random"
    upper: 0.2 # used when mode == "uniform_random"
    seed: 42 # random seed for generating tau when mode == "uniform_random"
    vector: null # optional length-T vector used when mode == "fixed"
  beta: 0.25 # z^{(t)} -> x^{(t)}
  xi: 0.08 # scalar coefficient on the fixed known graph
  eta: 0.01 # x^{(t-1)} -> x^{(t)}
  zeta: -0.03 # x^{(t-1)} -> z^{(t)}
  psi: 0.1 # z^{(t-1)} -> z^{(t)}

generation_params:
  seed: 42 # random seed for reproducibility
  gibbs_sweeps: 25 # number of Gibbs sweeps for sampling x^{(t)} in the conditional model
  intervention_mode: "generated_z" # options: "generated_z", "fixed_z"
  fixed_z_source:
    panel_path: null # required when intervention_mode == "fixed_z"
    z0_path: null # required when intervention_mode == "fixed_z"
    shared_panel_dir: null # optional metadata pointer to the shared artifact directory
    outcome_code: null # optional metadata for provenance
    intervention_code: null # optional metadata for provenance
    lag_code: null # optional metadata for provenance
    trim_scope: null # optional metadata for provenance
