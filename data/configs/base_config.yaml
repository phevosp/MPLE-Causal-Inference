global_params:
  N: 1000 # size of the network
  T: 100 # number of time steps
  s: 10 # number of pre-intervention time steps
  gamma_matrix_generator: "erdos_renyi" # method for generating the network. Options: "erdos_renyi", "complete", "empty"
  x_0_generator: "bernoulli" # method for generating the initial state. Options: "bernoulli", "fixed"
  basis_params:
    field_templates: ["intercept", "linear", "quadratic"] # low-dimensional manifold for the unknown external field
    interaction_templates: ["adjacency", "distance_kernel", "cross_similarity"] # low-dimensional manifold for the unknown interaction matrix
  gamma_matrix_params:
    p: 0.01 # probability of edge creation for "erdos-renyi"
  x_0_params:
    p: 0.5 # probability of being in state 1 for "bernoulli"
    fixed_val: 1 # options 1 or -1 for "fixed"

estimation_params:
  field_coefs: [0.35, -0.15, 0.05] # coefficients for the known field basis templates
  beta: 0.25 # z^{(t)} -> x^{(t)}
  interaction_coefs: [0.08, 0.03, -0.02] # coefficients for the known interaction basis templates
  eta: 0.01 # x^{(t-1)} -> x^{(t)}
  zeta: -0.03 # x^{(t-1)} -> z^{(t)}
  psi: 0.1 # z^{(t-1)} -> z^{(t)}

generation_params:
  seed: 42 # random seed for reproducibility
  gibbs_sweeps: 25 # number of Gibbs sweeps for sampling x^{(t)} in the conditional model
