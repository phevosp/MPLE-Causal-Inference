global_params:
  N: 1000 # size of the network
  T: 100 # number of time steps
  s: 10 # number of pre-intervention time steps
  gamma_matrix_generator: "erdos_renyi" # method for generating the network. Options: "erdos_renyi", "complete", "cycle", "empty"
  x_0_generator: "bernoulli" # method for generating the initial state. Options: "bernoulli", "fixed"
  basis_params:
    field_mode: "uniform" # options: "uniform", "shared_feature_field"
    interaction_mode: "known_graph" # options: "known_graph", "shared_feature_interactions"
    num_shared_features: 5 # number of known shared node features used in the richer basis construction
    shared_feature_seed: 42 # random seed used to realize the known shared features
    distance_kernel_decay: 3.0 # decay used in the per-feature distance kernel interaction templates
  gamma_matrix_params:
    p: 0.01 # probability of edge creation for "erdos-renyi"
  x_0_params:
    p: 0.5 # probability of being in state 1 for "bernoulli"
    fixed_val: 1 # options 1 or -1 for "fixed"

estimation_params:
  field_coefs: [0.35] # coefficients for the external field basis; default is intercept only
  beta: 0.25 # z^{(t)} -> x^{(t)}
  interaction_coefs: [0.08] # coefficients for the interaction basis; default is a single known graph up to temperature
  eta: 0.01 # x^{(t-1)} -> x^{(t)}
  zeta: -0.03 # x^{(t-1)} -> z^{(t)}
  psi: 0.1 # z^{(t-1)} -> z^{(t)}

generation_params:
  seed: 42 # random seed for reproducibility
  gibbs_sweeps: 25 # number of Gibbs sweeps for sampling x^{(t)} in the conditional model
