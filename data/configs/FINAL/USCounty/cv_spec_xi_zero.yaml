base:
  cv_root_name: cv_runs
  cv_manifest_path: experiments/FINAL/USCountyVaccination/cv_manifest_xi_zero.csv
  num_folds: 7  # Number of folds for spatiotemporal CV; can be overridden per search
  optimizer:
    steps: 2000
    tol: 1.0e-7
    seed: 0
    n_starts: 1
    proximal_lr: 1.0
  latent_rank: 5
  optimizer_mode: alternating_latent_rank
  lambda_nuclear: 0.0
  lambda_frobenius: 0.0
  lambda_uv_ridge: 0.0
  v_column_l2_max: 1.0
  estimation:
    fixed_scalar_params:
      xi: 0.0
    beta_mask_pre_s: true
    beta_mask_post_e: true

searches:
  - name: alternating_uv_grid_xi_zero
    split_source: validation_test_splits
    outer_num_folds: 6
    test_fold_id: 1
    validation_sampling:
      num_samples: 8
    grid:
      latent_rank: [3, 5, 8]
      lambda_uv_ridge: [0.001, 0.005, 0.01, 0.05, 0.1, 0.5]