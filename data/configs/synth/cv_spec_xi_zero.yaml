base:
  cv_root_name: cv_runs
  cv_manifest_path: experiments/Synthetic/cv_manifest.csv
  num_folds: 10  # Number of folds for spatiotemporal CV; can be overridden per search
  optimizer:
    steps: 2000
    tol: 1.0e-7
    seed: 0
    n_starts: 1
    proximal_lr: 1.0
  latent_rank: 3
  optimizer_mode: alternating_latent_rank
  lambda_nuclear: 0.0
  lambda_frobenius: 0.0
  lambda_uv_ridge: 0.0
  v_column_l2_max: 1.0
  estimation:
    fixed_scalar_params:
      xi: 0.0
    beta_mask_pre_s: false
    beta_mask_post_e: false

searches:
  - name: xi_zero_grid
    grid:
      lambda_uv_ridge: [0.001, 0.005, 0.01, 0.05, 0.1, 0.5, 1.0, 1.5]
