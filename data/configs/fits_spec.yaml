base:
  fit_root_name: fits
  fit_manifest_path: experiments/SyntheticHybridExperiments/fit_manifest.csv
  optimizer:
    steps: 20000
    tol: 1.0e-9
    seed: 0
    n_starts: 1
    proximal_lr: 1.0
  latent_rank: 0
  optimizer_mode: no_external_field
  lambda_nuclear: 0.0
  lambda_frobenius: 0.0
  lambda_uv_ridge: 0.0
  estimation:
    fixed_scalar_params: {}  # scalars fixed at these values (not estimated starting points)
    beta_mask_pre_s: false
    beta_mask_post_e: false

variants:
  - name: manifold_rank_2_rw
    optimizer_mode: exact_rank_manifold
    latent_rank: 2
    lambda_frobenius: 0.05

  - name: manifold_rank_5_rw
    optimizer_mode: exact_rank_manifold
    latent_rank: 5
    lambda_frobenius: 0.1

  - name: manifold_rank_10_rw
    optimizer_mode: exact_rank_manifold
    latent_rank: 10
    lambda_frobenius: 0.1

  - name: alternating_rank_10_rw
    optimizer_mode: alternating_latent_rank
    latent_rank: 10
    lambda_uv_ridge: 9

  - name: alternating_rank_5_rw
    optimizer_mode: alternating_latent_rank
    latent_rank: 5
    lambda_uv_ridge: 7

  - name: alternating_rank_2_rw
    optimizer_mode: alternating_latent_rank
    latent_rank: 2
    lambda_uv_ridge: 5

  - name: concurrent_rank_10_rw
    optimizer_mode: concurrent_latent_rank
    latent_rank: 10
    lambda_uv_ridge: 9

  - name: concurrent_rank_2_rw
    optimizer_mode: concurrent_latent_rank
    latent_rank: 2
    lambda_uv_ridge: 5

  - name: concurrent_rank_5_rw
    optimizer_mode: concurrent_latent_rank
    latent_rank: 5
    lambda_uv_ridge: 7

  - name: manifold_rank_2_rw_fixed_beta
    optimizer_mode: exact_rank_manifold
    latent_rank: 2
    lambda_frobenius: 0.05
    estimation:
      fixed_scalar_params:
        beta: -0.3

  - name: manifold_rank_5_rw_fixed_beta
    optimizer_mode: exact_rank_manifold
    latent_rank: 5
    lambda_frobenius: 0.1
    estimation:
      fixed_scalar_params:
        beta: -0.3

  - name: manifold_rank_10_rw_fixed_beta
    optimizer_mode: exact_rank_manifold
    latent_rank: 10
    lambda_frobenius: 0.1
    estimation:
      fixed_scalar_params:
        beta: -0.3

  - name: alternating_rank_10_rw_fixed_beta
    optimizer_mode: alternating_latent_rank
    latent_rank: 10
    lambda_uv_ridge: 9
    estimation:
      fixed_scalar_params:
        beta: -0.3

  - name: alternating_rank_5_rw_fixed_beta
    optimizer_mode: alternating_latent_rank
    latent_rank: 5
    lambda_uv_ridge: 7
    estimation:
      fixed_scalar_params:
        beta: -0.3

  - name: alternating_rank_2_rw_fixed_beta
    optimizer_mode: alternating_latent_rank
    latent_rank: 2
    lambda_uv_ridge: 5
    estimation:
      fixed_scalar_params:
        beta: -0.3

  - name: concurrent_rank_10_rw_fixed_beta
    optimizer_mode: concurrent_latent_rank
    latent_rank: 10
    lambda_uv_ridge: 9
    estimation:
      fixed_scalar_params:
        beta: -0.3

  - name: concurrent_rank_2_rw_fixed_beta
    optimizer_mode: concurrent_latent_rank
    latent_rank: 2
    lambda_uv_ridge: 5
    estimation:
      fixed_scalar_params:
        beta: -0.3

  - name: concurrent_rank_5_rw_fixed_beta
    optimizer_mode: concurrent_latent_rank
    latent_rank: 5
    lambda_uv_ridge: 7
    estimation:
      fixed_scalar_params:
        beta: -0.3