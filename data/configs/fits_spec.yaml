base:
  fit_root_name: fits
  fit_manifest_path: experiments/SyntheticHybridExperiments/fit_manifest.csv
  optimizer:
    steps: 20000
    tol: 1.0e-9
    seed: 0
    n_starts: 1
    proximal_lr: 1.0
  latent_rank: 0
  optimizer_mode: no_external_field
  lambda_nuclear: 0.0
  lambda_frobenius: 0.0
  lambda_uv_ridge: 0.0
  estimation:
    fixed_scalar_params: {}  # scalars fixed at these values (not estimated starting points)
    beta_mask_pre_s: false
    beta_mask_post_e: false

variants:
  - name: nuclear_lambda_6e_2
    optimizer_mode: nuclear_norm
    lambda_nuclear: 0.06

  - name: nuclear_lambda_8e_2
    optimizer_mode: nuclear_norm
    lambda_nuclear: 0.08

  - name: nuclear_lambda_1e_1
    optimizer_mode: nuclear_norm
    lambda_nuclear: 0.1

  - name: nuclear_lambda_12e_2
    optimizer_mode: nuclear_norm
    lambda_nuclear: 0.12

  - name: manifold_rank_2
    optimizer_mode: exact_rank_manifold
    latent_rank: 2
    lambda_frobenius: 0.1

  - name: manifold_rank_5
    optimizer_mode: exact_rank_manifold
    latent_rank: 5
    lambda_frobenius: 0.3

  - name: manifold_rank_10
    optimizer_mode: exact_rank_manifold
    latent_rank: 10
    lambda_frobenius: 0.5

  - name: alternating_rank_10
    optimizer_mode: alternating_latent_rank
    latent_rank: 10
    lambda_uv_ridge: 18

  - name: alternating_rank_5
    optimizer_mode: alternating_latent_rank
    latent_rank: 5
    lambda_uv_ridge: 14

  - name: alternating_rank_2
    optimizer_mode: alternating_latent_rank
    latent_rank: 2
    lambda_uv_ridge: 10

  - name: concurrent_rank_10
    optimizer_mode: concurrent_latent_rank
    latent_rank: 10
    lambda_uv_ridge: 18

  - name: concurrent_rank_2
    optimizer_mode: concurrent_latent_rank
    latent_rank: 2
    lambda_uv_ridge: 10

  - name: concurrent_rank_5
    optimizer_mode: concurrent_latent_rank
    latent_rank: 5
    lambda_uv_ridge: 14

  - name: zero_external_field
    optimizer_mode: no_external_field

  - name: nuclear_lambda_6e_2_xi_zero
    optimizer_mode: nuclear_norm
    lambda_nuclear: 0.06
    estimation:
      fixed_scalar_params:
        xi: 0.0

  - name: nuclear_lambda_8e_2_xi_zero
    optimizer_mode: nuclear_norm
    lambda_nuclear: 0.08
    estimation:
      fixed_scalar_params:
        xi: 0.0

  - name: nuclear_lambda_1e_1_xi_zero
    optimizer_mode: nuclear_norm
    lambda_nuclear: 0.1
    estimation:
      fixed_scalar_params:
        xi: 0.0

  - name: nuclear_lambda_12e_2_xi_zero
    optimizer_mode: nuclear_norm
    lambda_nuclear: 0.12
    estimation:
      fixed_scalar_params:
        xi: 0.0

  - name: manifold_rank_2_xi_zero
    optimizer_mode: exact_rank_manifold
    latent_rank: 2
    lambda_frobenius: 0.1
    estimation:
      fixed_scalar_params:
        xi: 0.0

  - name: manifold_rank_5_xi_zero
    optimizer_mode: exact_rank_manifold
    latent_rank: 5
    lambda_frobenius: 0.3
    estimation:
      fixed_scalar_params:
        xi: 0.0

  - name: manifold_rank_10_xi_zero
