base:
  fit_root_name: fits
  fit_manifest_path: experiments/SyntheticHybridExperiments/fit_manifest.csv
  optimizer:
    steps: 5000
    tol: 1.0e-9
    seed: 0
    n_starts: 3
    adam_steps: 1000
    adam_lr: 1.0e-2
    adam_device: cpu
  B: 1.0
  latent_rank: 0
  estimation:
    fit_intervention_model: true
    beta_mask_pre_intervention: false
    fixed_scalar_params: {}

variants:
  - name: rank_40_B1
    latent_rank: 40

  - name: rank_40_B1_fixed_xi
    latent_rank: 40
    estimation:
      fixed_scalar_params:
        xi: 0.0
