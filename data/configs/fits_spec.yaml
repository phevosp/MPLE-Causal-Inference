base:
  fit_root_name: fits
  fit_manifest_path: experiments/SyntheticHybridExperiments/fit_manifest.csv
  optimizer:
    steps: 5000
    tol: 1.0e-9
    seed: 0
    n_starts: 1
    proximal_lr: 1.0
  latent_rank: 0
  optimizer_mode: manifold
  lambda_nuclear: 0.0
  lambda_frobenius: 0.0
  lambda_uv_ridge: 0.0
  estimation:
    fixed_scalar_params: {}

variants:
  - name: nuclear_lambda_15e_2
    optimizer_mode: nuclear_norm
    lambda_nuclear: 0.15
    estimation:
      fixed_scalar_params:
        beta: 0
        xi: 0
        eta: 0

  - name: nuclear_lambda_1e_1
    optimizer_mode: nuclear_norm
    lambda_nuclear: 0.1
    estimation:
      fixed_scalar_params:
        beta: 0
        xi: 0
        eta: 0

  - name: alternative_low_rank_1
    optimizer_mode: alternative_low_rank
    latent_rank: 1
    lambda_uv_ridge: 0.5
    estimation:
      fixed_scalar_params:
        beta: 0
        xi: 0
        eta: 0

  - name: alternative_low_rank_10
    optimizer_mode: alternative_low_rank
    latent_rank: 10
    lambda_uv_ridge: 0.5
    estimation:
      fixed_scalar_params:
        beta: 0
        xi: 0
        eta: 0
