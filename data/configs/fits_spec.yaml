base:
  fit_root_name: fits
  fit_manifest_path: experiments/SyntheticHybridExperiments/fit_manifest.csv
  optimizer:
    steps: 5000
    tol: 1.0e-9
    seed: 0
    n_starts: 3
    adam_steps: 1000
    adam_lr: 1.0e-2
    adam_device: cpu
    proximal_lr: 1.0
  B: 15.0
  latent_rank: 0
  field_mode: low_rank
  lambda_nuclear: 0.0
  estimation:
    fixed_scalar_params: {}

variants:
  - name: nuclear_lambda_5e_2_B15
    field_mode: nuclear_norm
    lambda_nuclear: 0.05
    estimation:
      fixed_scalar_params:
        beta: 0.55
        xi: 0.75
        eta: -0.3

  - name: nuclear_lambda_8e_2_B15
    field_mode: nuclear_norm
    lambda_nuclear: 0.08
    estimation:
      fixed_scalar_params:
        beta: 0.55
        xi: 0.75
        eta: -0.3

  - name: nuclear_lambda_1e_1_B15
    field_mode: nuclear_norm
    lambda_nuclear: 0.1
    estimation:
      fixed_scalar_params:
        beta: 0.55
        xi: 0.75
        eta: -0.3