base:
  fit_root_name: fits
  fit_manifest_path: experiments/SyntheticHybridExperiments/fit_manifest.csv
  optimizer:
    steps: 3000
    tol: 1.0e-9
    seed: 0
  B: 1.0
  latent_rank: 0
  estimation:
    fit_intervention_model: true
    beta_mask_pre_intervention: false
    beta_mask_rescale: false
    fixed_scalar_params: {}

variants:
  - name: rank_0

  - name: rank_6_B1
    latent_rank: 6

  - name: rank_40_B1
    latent_rank: 40

  - name: rank_6_B6
    B: 6.0
    latent_rank: 6

  - name: rank_40_B6
    B: 6.0
    latent_rank: 40

  - name: rank_6_B1_fixed_xi
    latent_rank: 6
    estimation:
      fixed_scalar_params:
        xi: 0.0

  - name: rank_40_B1_fixed_xi
    latent_rank: 40
    estimation:
      fixed_scalar_params:
        xi: 0.0

  - name: rank_6_B6_fixed_xi
    B: 6.0
    latent_rank: 6
    estimation:
      fixed_scalar_params:
        xi: 0.0

  - name: rank_40_B6_fixed_xi
    B: 6.0
    latent_rank: 40
    estimation:
      fixed_scalar_params:
        xi: 0.0
