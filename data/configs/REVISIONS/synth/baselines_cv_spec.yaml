base:
  cv_root_name: cv_runs_baselines
  cv_manifest_path: experiments/Synthetic/cv_manifest_baselines.csv
  num_folds: 7
  outer_num_folds: 6
  optimizer:
    steps: 2000
    tol: 1.0e-7
    seed: 0
    n_starts: 1
    proximal_lr: 1.0
  latent_rank: 3
  optimizer_mode: alternating_treatment_split_latent_rank
  lambda_nuclear: 0.0
  lambda_frobenius: 0.0
  lambda_uv_ridge: 0.0
  v_column_l2_max: 1.0
  estimation:
    fixed_scalar_params: # Fixed to zero, because we ignore these effects
      beta: 0.0
      xi: 0.0
      eta: 0.0
    beta_mask_pre_s: false
    beta_mask_post_e: false

searches:
  - name: treatment_split
    split_kind: train_cv
    optimizer_mode: alternating_treatment_split_latent_rank
    grid:
      latent_rank: [1, 3, 5]
      lambda_uv_ridge: [0.001, 0.005, 0.01, 0.05, 0.1, 0.5]

  - name: treatment_shared_unit
    split_kind: train_cv
    optimizer_mode: alternating_treatment_shared_unit_latent_rank
    grid:
      latent_rank: [1, 3, 5]
      lambda_uv_ridge: [0.001, 0.005, 0.01, 0.05, 0.1, 0.5]