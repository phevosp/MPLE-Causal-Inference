base:
  fit_root_name: fits_baselines
  fit_manifest_path: experiments/Synthetic/fit_manifest_baselines_x10.csv
  optimizer:
    steps: 20000
    tol: 1.0e-9
    seed: 0
    n_starts: 1
    proximal_lr: 1.0
  latent_rank: 3
  optimizer_mode: alternating_treatment_split_latent_rank
  lambda_nuclear: 0.0
  lambda_frobenius: 0.0
  lambda_uv_ridge: 0.0
  v_column_l2_max: 1.0
  estimation:
    fixed_scalar_params:
      beta: -0.3
      xi: 0.8
      eta: 0.3
    beta_mask_pre_s: false
    beta_mask_post_e: false

variants:
  - name: treatment_split_rank_3_uv_5_e2
    optimizer_mode: alternating_treatment_split_latent_rank
    latent_rank: 3
    lambda_uv_ridge: .05

  - name: treatment_shared_unit_rank_3_uv_5_e2
    optimizer_mode: alternating_treatment_shared_unit_latent_rank
    latent_rank: 3
    lambda_uv_ridge: .05
