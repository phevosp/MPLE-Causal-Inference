base:
  fit_root_name: fits
  fit_manifest_path: experiments/USCounty/fit_snn_train_test_manifest.csv
  optimizer:
    steps: 2000
    tol: 1.0e-6
    seed: 0
    n_starts: 1
    proximal_lr: 1.0
  latent_rank: 0
  optimizer_mode: no_external_field
  lambda_nuclear: 0.0
  lambda_frobenius: 0.0
  lambda_uv_ridge: 0.0
  v_column_l2_max: 1.0
  estimation:
    fixed_scalar_params: {}
    beta_mask_pre_s: false
    beta_mask_post_e: false

variants:
  - name: snn_8nn_u_mr2
    optimizer_mode: snn_treatment_split
    snn:
      n_neighbors: 8
      weights: uniform
      anchor_solver: bitset_exact
      random_splits: false
      max_rank: 2
      linear_span_eps: 0.05
      subspace_eps: 0.05
