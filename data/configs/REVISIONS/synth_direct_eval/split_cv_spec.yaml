base:
  cv_root_name: cv_runs
  cv_manifest_path: experiments/SyntheticDirectEval/cv_manifest.csv
  num_folds: 2
  outer_num_folds: 2
  optimizer:
    steps: 100
    tol: 1.0e-6
    seed: 0
    n_starts: 1
    proximal_lr: 1.0
  latent_rank: 2
  optimizer_mode: alternating_latent_rank
  lambda_uv_ridge: 0.05
  estimation:
    fixed_scalar_params: {}

searches:
  - name: direct_test_train_split
    split_kind: test_train_cv
    num_folds: 2
    outer_num_folds: 2
    test_fold_id: 1
    grid:
      lambda_uv_ridge: [0.05]
