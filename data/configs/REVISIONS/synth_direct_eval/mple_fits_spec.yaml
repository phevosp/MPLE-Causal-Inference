base:
  fit_root_name: fits
  fit_manifest_path: experiments/SyntheticDirectEval/fit_manifest_mple.csv
  optimizer:
    steps: 100
    tol: 1.0e-6
    seed: 0
    n_starts: 1
    proximal_lr: 1.0
  latent_rank: 0
  optimizer_mode: no_external_field
  lambda_nuclear: 0.0
  lambda_frobenius: 0.0
  lambda_uv_ridge: 0.0
  v_column_l2_max: 1.0
  estimation:
    fixed_scalar_params: {}
    beta_mask_pre_s: false
    beta_mask_post_e: false

variants:
  - name: alternating_rank_2_uv_5_e2
    optimizer_mode: alternating_latent_rank
    latent_rank: 2
    lambda_uv_ridge: 0.05
