base:
  cv_root_name: cv_runs
  cv_manifest_path: experiments/SyntheticNoInterference/cv_manifest.csv
  num_folds: 7  # Number of folds for spatiotemporal CV; can be overridden per search
  outer_num_folds: 6 # Number of outer folds for test set
  optimizer:
    steps: 2000
    tol: 1.0e-7
    seed: 0
    n_starts: 1
    proximal_lr: 1.0
  latent_rank: 3
  optimizer_mode: alternating_latent_rank
  lambda_nuclear: 0.0
  lambda_frobenius: 0.0
  lambda_uv_ridge: 0.0
  v_column_l2_max: 1.0
  estimation:
    fixed_scalar_params: {}
    beta_mask_pre_s: true
    beta_mask_post_e: true

searches:
  - name: default
    split_kind: train_cv
    grid:
      lambda_uv_ridge: [0.001, 0.005, 0.01, 0.05, 0.1, 0.5]

  - name: xi_zero
    split_kind: train_cv
    grid:
      lambda_uv_ridge: [0.001, 0.005, 0.01, 0.05, 0.1, 0.5]
    estimation:
      fixed_scalar_params:
        xi: 0.0

  - name: default_test_train
    split_kind: test_train_cv
    grid:
      lambda_uv_ridge: [0.001, 0.005, 0.01, 0.05, 0.1, 0.5]

  - name: xi_zero_test_train
    split_kind: test_train_cv
    grid:
      lambda_uv_ridge: [0.001, 0.005, 0.01, 0.05, 0.1, 0.5]
    estimation:
      fixed_scalar_params:
        xi: 0.0