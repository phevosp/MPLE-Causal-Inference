base:
  cv_root_name: cv_runs
  cv_manifest_path: experiments/SyntheticHybridExperiments/cv_manifest.csv
  optimizer:
    steps: 5000
    tol: 1.0e-9
    seed: 0
    n_starts: 1
    proximal_lr: 1.0
  latent_rank: 0
  optimizer_mode: no_external_field
  lambda_nuclear: 0.0
  lambda_frobenius: 0.0
  lambda_uv_ridge: 0.0
  estimation:
    fixed_scalar_params: {}
    beta_mask_pre_s: false
    beta_mask_post_e: false

searches:
  - name: alternating_uv_grid
    optimizer_mode: alternating_latent_rank
    grid:
      latent_rank: [1]
      lambda_uv_ridge: [0.1, 0.5, 1, 5]
