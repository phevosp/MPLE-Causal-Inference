base:
  experiment_root: experiments/FINAL/Synthetic
  manifest_path: experiments/FINAL/Synthetic/generation_manifest_synth.csv
  dimensions:
    N: 500
    T: 50
  generation:
    gibbs_sweeps: 100
    seed: 42
  x0:
    generator: bernoulli
    params:
      p: 0.5
      fixed_val: null
  graph:
    source: generated
    generator: erdos_renyi
    params:
      p: 0.01
    artifact:
      gamma_path: null
      node_index_path: null
      artifact_dir: null
      network_name: null
      trim_scope: null
  intervention:
    source: generated
    generator: low_rank_probability
    params:
      singular_values: [1.0, 0.7, 0.49]
      probability_amplitude: 0.5
    artifact:
      panel_path: null
      z0_path: null
      artifact_dir: null
      shared_panel_dir: null
      outcome_code: null
      intervention_code: null
      lag_code: null
      trim_scope: null
  truth:
    B: 1.0
    field_mode: random_low_rank
    field_params:
      singular_values: [2.0, 0.7, 0.49]
      target_rms_fraction: 0.4
    scalars:
      beta: -0.3
      xi: 0.8
      eta: 0.3
      zeta: 0
      psi: 0

