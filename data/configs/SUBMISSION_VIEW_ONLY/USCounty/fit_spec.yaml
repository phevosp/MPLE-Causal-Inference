base:
  fit_root_name: fits
  fit_manifest_path: experiments/FINAL/USCountyVaccination/fit_manifest.csv
  optimizer:
    steps: 20000
    tol: 1.0e-9
    seed: 0
    n_starts: 1
    proximal_lr: 1.0
  latent_rank: 0
  optimizer_mode: no_external_field
  lambda_nuclear: 0.0
  lambda_frobenius: 0.0
  lambda_uv_ridge: 0.0
  v_column_l2_max: 1.0
  estimation:
    fixed_scalar_params: {}  # scalars fixed at these values (not estimated starting points)
    beta_mask_pre_s: false
    beta_mask_post_e: false

variants:
  - name: alternating_rank_5_uv_5_e3
    optimizer_mode: alternating_latent_rank
    latent_rank: 5
    lambda_uv_ridge: .005

  - name: alternating_rank_5_uv_1_e2_xi_zero
    optimizer_mode: alternating_latent_rank
    latent_rank: 5
    lambda_uv_ridge: .01
    estimation:
      fixed_scalar_params:
        xi: 0.0
