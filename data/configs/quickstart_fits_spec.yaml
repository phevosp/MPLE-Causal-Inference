base:
  fit_root_name: fits
  fit_manifest_path: experiments/Quickstart/fit_manifest.csv
  optimizer:
    steps: 500
    tol: 1.0e-6
    seed: 0
    n_starts: 1
    proximal_lr: 1.0
  latent_rank: 0
  optimizer_mode: manifold
  lambda_nuclear: 0.0
  lambda_uv_ridge: 0.0
  estimation:
    fixed_scalar_params: {}  # scalars fixed at these values (not estimated starting points)

variants:
  - name: manifold_rank_2
    latent_rank: 2
