base:
  fit_root_name: fits
  fit_manifest_path: experiments/USCountyVaccination_US_trimmed/fit_manifest.csv
  optimizer:
    steps: 50000
    tol: 1.0e-9
    seed: 0
    n_starts: 5
    proximal_lr: 1.0
  latent_rank: 0
  optimizer_mode: no_external_field
  lambda_nuclear: 0.0
  lambda_frobenius: 0.0
  lambda_uv_ridge: 0.0
  estimation:
    fixed_scalar_params: {}  # scalars fixed at these values (not estimated starting points)

variants:
  - name: nuclear_lambda_1e_1_updated
    optimizer_mode: nuclear_proximal
    lambda_nuclear: 0.1

  - name: manifold_rank_1
    optimizer_mode: exact_rank_manifold
    latent_rank: 1
    lambda_frobenius: 0.1

  - name: manifold_rank_10
    optimizer_mode: exact_rank_manifold
    latent_rank: 10
    lambda_frobenius: 0.1

  - name: alternating_rank_10
    optimizer_mode: alternating_latent_rank
    latent_rank: 10
    lambda_uv_ridge: 0.1

  - name: alternating_rank_1
    optimizer_mode: alternating_latent_rank
    latent_rank: 1
    lambda_uv_ridge: 0.1

  # - name: concurrent_rank_10
  #   optimizer_mode: concurrent_latent_rank
  #   latent_rank: 10
  #   lambda_uv_ridge: 0.1
