base:
  fit_root_name: fits
  fit_manifest_path: experiments/USCountyVaccination_US_trimmed/fit_manifest.csv
  optimizer:
    steps: 20000
    tol: 1.0e-9
    seed: 0
    n_starts: 1
    proximal_lr: 1.0
  latent_rank: 0
  optimizer_mode: no_external_field
  lambda_nuclear: 0.0
  lambda_frobenius: 0.0
  lambda_uv_ridge: 0.0
  estimation:
    fixed_scalar_params: {}  # scalars fixed at these values (not estimated starting points)
    beta_mask_pre_s: true
    beta_mask_post_e: false

variants:
  - name: nuclear_lambda_6e_2_beta_mask
    optimizer_mode: nuclear_norm
    lambda_nuclear: 0.06

  - name: nuclear_lambda_8e_2_beta_mask
    optimizer_mode: nuclear_norm
    lambda_nuclear: 0.08

  - name: nuclear_lambda_1e_1_beta_mask
    optimizer_mode: nuclear_norm
    lambda_nuclear: 0.1

  - name: nuclear_lambda_12e_2_beta_mask
    optimizer_mode: nuclear_norm
    lambda_nuclear: 0.12

  - name: alternating_rank_20_lambda_25_beta_mask
    optimizer_mode: alternating_latent_rank
    latent_rank: 20
    lambda_uv_ridge: 25

  - name: alternating_rank_10_lambda_18_beta_mask
    optimizer_mode: alternating_latent_rank
    latent_rank: 10
    lambda_uv_ridge: 18

  - name: alternating_rank_5_lambda_14_beta_mask
    optimizer_mode: alternating_latent_rank
    latent_rank: 5
    lambda_uv_ridge: 14

  - name: alternating_rank_2_lambda_10_beta_mask
    optimizer_mode: alternating_latent_rank
    latent_rank: 2
    lambda_uv_ridge: 10

  - name: alternating_rank_20_lambda_15_beta_mask
    optimizer_mode: alternating_latent_rank
    latent_rank: 20
    lambda_uv_ridge: 15
    
  - name: alternating_rank_10_lambda_10_beta_mask
    optimizer_mode: alternating_latent_rank
    latent_rank: 10
    lambda_uv_ridge: 10

  - name: alternating_rank_5_lambda_10_beta_mask
    optimizer_mode: alternating_latent_rank
    latent_rank: 5
    lambda_uv_ridge: 10

  - name: alternating_rank_2_lambda_5_beta_mask
    optimizer_mode: alternating_latent_rank
    latent_rank: 2
    lambda_uv_ridge: 5

  - name: zero_external_field_beta_mask
    optimizer_mode: no_external_field
