base:
  fit_root_name: fits
  fit_manifest_path: experiments/USCountyVaccination_US_trimmed/fit_manifest.csv
  optimizer:
    steps: 50000
    tol: 1.0e-9
    seed: 0
    n_starts: 5
    proximal_lr: 1.0
  latent_rank: 0
  optimizer_mode: manifold
  lambda_nuclear: 0.0
  lambda_frobenius: 0.0
  lambda_uv_ridge: 0.0
  estimation:
    fixed_scalar_params: {}

variants:
  - name: rank_10
    latent_rank: 10

  - name: rank_40
    latent_rank: 40

  - name: rank_40_penalized
    latent_rank: 40
    lambda_uv_ridge: 0.1
