  T: 30
  s: 5
  gamma_matrix_generator: erdos_renyi
  x_0_generator: bernoulli
  basis_params:
    field_templates:
    - intercept
    - linear
    - quadratic
    interaction_templates:
    - adjacency
    - smooth_similarity
    - weighted_adjacency
  gamma_matrix_params:
    p: 0.08
  x_0_params:
    p: 0.5
    fixed_val: 1
estimation_params:
  field_coefs:
  - 0.35
  - -0.15
  - 0.05
  beta: 0.25
  interaction_coefs:
  - 0.08
  - 0.03
  - -0.02
  eta: 0.01
  zeta: -0.03
  psi: 0.1
generation_params:
  seed: 7
  process: conditional
  gibbs_sweeps: 12
